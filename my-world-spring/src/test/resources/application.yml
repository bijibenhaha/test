server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;db_close_delay=-1;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    hikari:
      auto-commit: true

mybatis-plus:
  type-aliases-package: org.john.worldspring.one.demos.web
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-prefix: t_
